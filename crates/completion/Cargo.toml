rayon.workspace = true
rowan.workspace = true
rustc-hash.workspace = true
syntax = { workspace = true }
url.workspace = true

[dev-dependencies]
criterion.workspace = true
distro = { workspace = true }
expect-test.workspace = true
test-utils = { workspace = true }
