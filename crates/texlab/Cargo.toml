[package]
name = "texlab"
description = "LaTeX Language Server"
version.workspace = true
license.workspace = true
readme = "../../README.md"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage = "https://github.com/latex-lsp/texlab"
repository = "https://github.com/latex-lsp/texlab"
documentation = "https://github.com/latex-lsp/texlab"
keywords = ["lsp", "server", "latex", "bibtex"]
categories = ["development-tools"]
exclude = ["*.snap"]

[[bin]]
name = "texlab"
test = false

[lib]
doctest = false

[dependencies]
anyhow.workspace = true
base-db = { workspace = true }
bibfmt = { workspace = true }
citeproc = { workspace = true }
clap = { workspace = true, features = ["derive"] }
commands = { workspace = true }
completion = { workspace = true }
completion-data = { workspace = true }
crossbeam-channel.workspace = true
definition = { workspace = true }
diagnostics = { workspace = true }
distro = { workspace = true }
fern.workspace = true
folding = { workspace = true }
highlights = { workspace = true }
hover = { workspace = true }
inlay-hints = { workspace = true }
ipc = { workspace = true }
line-index = { workspace = true }
links = { workspace = true }
log.workspace = true
lsp-server.workspace = true
lsp-types.workspace = true
notify-debouncer-full.workspace = true
notify.workspace = true
parking_lot.workspace = true
percent-encoding.workspace = true
parser = { workspace = true }
references = { workspace = true }
regex.workspace = true
rename = { workspace = true }
rowan.workspace = true
rustc-hash.workspace = true
serde_json.workspace = true
serde_regex.workspace = true
serde_repr.workspace = true
serde.workspace = true
symbols = { workspace = true }
syntax = { workspace = true }
tempfile.workspace = true
threadpool.workspace = true
titlecase.workspace = true
url.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "bench_main"
path = "benches/bench_main.rs"
harness = false
